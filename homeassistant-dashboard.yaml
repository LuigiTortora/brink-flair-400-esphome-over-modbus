# Home Assistant Lovelace Dashboard - Brink Flair 400
#
# Recreates the functions of the local ESPHome web dashboard as a native Home
# Assistant dashboard. It runs through the regular Home Assistant API and is
# therefore reachable via cloud/remote access without exposing the ESP32 to
# the internet.
#
# Setup:
#   1. Replace every occurrence of "DEIN_BEREICH_" below with the actual
#      area/device prefix of your entities (use the editor's find & replace).
#      You can find the exact entity IDs in Home Assistant under
#      Developer tools -> States (filter by "brink").
#   2. Home Assistant -> Settings -> Dashboards -> Add dashboard
#      -> "New dashboard from scratch".
#   3. Open the new dashboard -> pencil (edit) -> three-dot menu at the top
#      right -> "Raw configuration editor".
#   4. Paste the complete contents of this file, replacing the existing ones.
#   5. Save.
#
# If a card shows red / "Entity not found" in the editor: look up the entity
# ID under Developer tools -> States and correct it.
#
# Note: the entity IDs keep their German names because they are derived from
# the entity names defined in brinkflair400.yaml.

views:
  - title: Ventilation
    path: brink-flair-400
    icon: mdi:air-filter
    cards:
      - type: entities
        title: Control
        icon: mdi:fan-auto
        entities:
          - entity: select.DEIN_BEREICH_brinkflair400_brink_betriebsmodus
            name: Operating mode
          - entity: sensor.DEIN_BEREICH_brink_flair_400_steuerung_brink_letzte_aktion
            name: Last action
          - entity: select.DEIN_BEREICH_brinkflair400_bypass_mode
            name: Bypass mode
          - entity: switch.DEIN_BEREICH_brinkflair400_bypass_boost
            name: Bypass boost active
          - entity: number.DEIN_BEREICH_brink_flair_400_bypass_boost_stufe
            name: Bypass boost level
          - entity: button.DEIN_BEREICH_brinkflair400_filter_reset
            name: Reset filter
          - entity: button.DEIN_BEREICH_brinkflair400_restart
            name: Restart ESP
      - type: entities
        title: Status
        icon: mdi:information-outline
        entities:
          - entity: sensor.DEIN_BEREICH_brinkflair400_status
            name: Operating status (raw value)
          - entity: sensor.DEIN_BEREICH_brinkflair400_bypass_status
            name: Bypass
          - entity: sensor.DEIN_BEREICH_brinkflair400_frost_status
            name: Frost protection
          - entity: sensor.DEIN_BEREICH_brinkflair400_filter_status
            name: Filter
          - entity: >-
              binary_sensor.DEIN_BEREICH_brink_flair_400_steuerung_brink_esp_status
            name: ESP connection
          - entity: sensor.brink_flair_400_brink_wlan_signal
            name: Wi-Fi signal
          - entity: sensor.DEIN_BEREICH_brink_flair_400_brink_esp_laufzeit
            name: ESP uptime
      - type: entities
        title: Outdoor climate & pressure
        icon: mdi:weather-windy
        entities:
          - entity: sensor.DEIN_BEREICH_brink_flair_400_aussenluft_temperatur
            name: Outdoor air temperature
          - entity: sensor.DEIN_BEREICH_brink_flair_400_zuluft_druck
          - entity: sensor.DEIN_BEREICH_brink_flair_400_abluft_druck
      - type: entities
        title: Indoor climate (supply/exhaust air)
        icon: mdi:home-thermometer-outline
        entities:
          - entity: sensor.DEIN_BEREICH_brink_flair_400_zuluft_temperatur
          - entity: sensor.DEIN_BEREICH_brink_flair_400_zuluft_luftfeuchtigkeit
          - entity: sensor.DEIN_BEREICH_brink_flair_400_zuluft_taupunkt
          - entity: sensor.DEIN_BEREICH_brink_flair_400_fortluft_temperatur
          - entity: sensor.DEIN_BEREICH_brink_flair_400_fortluft_luftfeuchtigkeit
          - entity: sensor.DEIN_BEREICH_brink_flair_400_fortluft_taupunkt
      - type: entities
        title: Filter
        icon: mdi:air-filter
        entities:
          - entity: sensor.DEIN_BEREICH_brink_flair_400_aktuelle_filterstunden
          - entity: sensor.DEIN_BEREICH_brink_flair_400_aktuelle_filtertage
          - entity: sensor.DEIN_BEREICH_brink_flair_400_filter_austauschen_in
          - entity: sensor.DEIN_BEREICH_brink_flair_400_filternutzung_m3
          - entity: number.DEIN_BEREICH_brink_flair_400_tage_vor_filterwarnung
          - entity: sensor.DEIN_BEREICH_brink_flair_400_filter_reset_angeschaltet
      - type: entities
        title: Air flow & fans
        icon: mdi:fan
        entities:
          - entity: sensor.DEIN_BEREICH_brink_flair_400_eingestelltes_zuluft_volumen
          - entity: sensor.DEIN_BEREICH_brink_flair_400_aktuelles_zuluft_volumen
          - entity: >-
              sensor.DEIN_BEREICH_brink_flair_400_geschwindigkeit_zuluftventilator
          - entity: sensor.DEIN_BEREICH_brink_flair_400_eingestelltes_abluft_volumen
          - entity: sensor.DEIN_BEREICH_brink_flair_400_aktuelles_abluft_volumen
          - entity: >-
              sensor.DEIN_BEREICH_brink_flair_400_geschwindigkeit_abluftventilator
          - type: divider
          - entity: number.DEIN_BEREICH_brinkflair400_flow_0
            name: Flow level 0 (Away)
          - entity: number.DEIN_BEREICH_brinkflair400_flow_1
            name: Flow level 1 (Low)
          - entity: number.DEIN_BEREICH_brinkflair400_flow_2
            name: Flow level 2 (Normal)
          - entity: number.DEIN_BEREICH_brinkflair400_flow_3
            name: Flow level 3 (High)
      - type: entities
        title: Frost protection
        icon: mdi:snowflake
        entities:
          - entity: sensor.DEIN_BEREICH_brink_flair_400_frost_vorheizer_power
          - entity: sensor.DEIN_BEREICH_brink_flair_400_frost_lufter_reduktion
          - entity: number.DEIN_BEREICH_brink_flair_400_frostschutztemperatur
          - entity: number.DEIN_BEREICH_brink_flair_400_mindest_einblastemperatur
      - type: entities
        title: Bypass settings
        icon: mdi:valve
        entities:
          - entity: number.DEIN_BEREICH_brink_flair_400_bypass_wunschtemperatur
          - entity: number.DEIN_BEREICH_brink_flair_400_bypass_aussentemperatur
            name: Bypass outdoor temperature
          - entity: number.DEIN_BEREICH_brink_flair_400_bypass_hysterese
      - type: entities
        title: Advanced
        icon: mdi:tune
        entities:
          - entity: number.DEIN_BEREICH_brink_flair_400_ungleichgewicht_zuluft
          - entity: number.DEIN_BEREICH_brink_flair_400_ungleichgewicht_abluft
          - entity: sensor.DEIN_BEREICH_brink_flair_400_geratetyp
            name: Device type
      - type: entities
        title: Diagnostics (Modbus readback)
        icon: mdi:bug-outline
        show_header_toggle: false
        entities:
          - entity: >-
              sensor.DEIN_BEREICH_brink_flair_400_brink_readback_7990_modbus_interface
          - entity: >-
              sensor.DEIN_BEREICH_brink_flair_400_brink_readback_8000_modbus_control
          - entity: sensor.DEIN_BEREICH_brink_flair_400_brink_readback_8001_stufe
          - entity: sensor.DEIN_BEREICH_brink_flair_400_brink_readback_8003_standby
